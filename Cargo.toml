[workspace]
resolver = "2"
members = [
  "crates/nyet-core",
  "crates/nyet-cli",
  "crates/nyet-helper",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/tellmeY18/nyet"

[workspace.dependencies]
nyet-core = { path = "crates/nyet-core" }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rnix = "0.11"
sha2 = "0.10"
